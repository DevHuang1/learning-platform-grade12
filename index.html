      <h1>G12 English Vocab Quiz</h1>
      <div class="sub">Study with me · Meaning by Unit</div>

      <div class="card controls">

      </div>

      <div class="card modes">

      </div>

      <div class="card modes diff">

        <button class="diff-btn" id="diffAdvanced">Advanced</button>
      </div>

      <div class="card score">
        <div class="box" id="correct">
          <div class="num">0</div>
          <div class="lbl">Correct</div>
        </div>
        <div class="box">
          <div class="num" id="total">0</div>
          <div class="lbl">Answered</div>
        </div>
        <div class="box" id="streak">
          <div class="num">0</div>
          <div class="lbl">Streak</div>
        </div>
      </div>

      <div class="card" id="quizCard">
        <span class="tag" id="unitTag"></span>
        <span class="clue-label" id="clueLabel"></span>
        <div class="clue" id="clue"></div>
        <div class="mask" id="mask"></div>
        <div class="hint" id="hint"></div>
        <div class="input-row">
          <input
            type="text"
            id="answer"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Type the English word..."
          />
          <button class="btn" id="checkBtn">Check</button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>

      <div class="card history">
        <div class="history-head">
          <span class="history-title">History</span>
          <button class="btn secondary small" id="clearHistory">Clear</button>
        </div>
        <div class="history-meta" id="historyMeta"></div>
        <div id="historyList"></div>
      </div>

      <div class="footer">
        Blank · Meaning — pick a difficulty. Advanced hides all hints and uses harder, complex sentences.
      </div>
    </div>

      const HISTORY_KEY = "g12vocab_history";
      let history = loadHistory();

      function loadHistory() {
        try {
          const raw = localStorage.getItem(HISTORY_KEY);
          const arr = raw ? JSON.parse(raw) : [];
          return Array.isArray(arr) ? arr : [];
        } catch (e) {
          return [];
        }
      }

      function saveHistory() {
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        } catch (e) {}
      }

      function addHistory(rec) {
        history.unshift(rec);
        if (history.length > 500) history.length = 500;
        saveHistory();
        renderHistory();
      }

      function renderHistory() {
        const meta = history.length
          ? history.length +
            " answered · " +
            history.filter((h) => h.ok).length +
            " correct"
          : "";
        historyMeta.textContent = meta;
        if (!history.length) {
          historyList.innerHTML =
            '<div class="h-empty">No questions answered yet.</div>';
          return;
        }
        const bold = (s) => "<b>" + esc(s) + "</b>";
        historyList.innerHTML = history
          .map((h) => {
            const badge = h.ok
              ? '<span class="h-badge">Correct ✓</span>'
              : '<span class="h-badge">Wrong ✗</span>';
            const guess =
              '<div class="h-guess ' +
              (h.ok ? "correct" : "wrong") +
              '">You: ' +
              esc(h.guess || "(no answer)") +
              (h.ok
                ? ""
                : ' · Correct: <span class="answer-line">' +
                  esc(h.word) +
                  "</span>") +
              "</div>";
            return (
              '<div class="h-entry ' +
              (h.ok ? "ok" : "bad") +
              '">' +
              '<div class="h-top"><span class="h-word">' +
              esc(h.word) +
              '</span>' +
              badge +
              "</div>" +
              (h.sentence
                ? '<div class="h-sentence">' +
                  bold("Clue: ") +
                  esc(h.sentence) +
                  "</div>"
                : "") +
              '<div class="h-m">' +
              bold("Meaning: ") +
              esc(h.m) +
              "</div>" +
              guess +
              '<div class="h-time">' +
              esc(h.timeLabel) +
              (h.difficulty ? " · " + esc(h.difficulty) : "") +
              (h.mode ? " · " + esc(h.mode) : "") +

              "</div>"

      function buildSelect() {
        const all = document.createElement("option");
        all.value = "all";
        all.textContent = "All Units";
        unitSelect.appendChild(all);
        WORDS.forEach((u) => {
          const o = document.createElement("option");
          o.value = u.unit;
          o.textContent = "Unit " + u.unit + ": " + u.title;
          unitSelect.appendChild(o);
        });
      }

      function getPool() {
        const v = unitSelect.value;
        let items =
          v === "all"
            ? WORDS.flatMap((u) =>
                u.words.map((w) => ({ ...w, unit: u.unit, title: u.title })),
              )
            : WORDS.find((u) => String(u.unit) === v).words.map((w) => ({
                ...w,
                unit: v,
                title: "",
              }));
        if (mode === "blank") {
          const bank = difficulty === "advanced" ? ADVANCED_SENTENCES : SENTENCES;
          items = items.filter((w) => bank && bank[w.unit + "." + w.n]);
        }
        return items;
      }

      function maskWord(word) {
        const chars = [...word];
        let out = "";
        chars.forEach((c, i) => {
          if (/[a-zA-Z]/.test(c)) {
            out +=
              i === 0 || (i > 0 && !/[a-zA-Z]/.test(chars[i - 1])) ? c : "_";
          } else {
            out += c;
          }
        });
        return out;
      }

      function maskFull(word) {
        return [...word]
          .map((c) => (/[a-zA-Z]/.test(c) ? "_" : c))
          .join("");
      }

      function pickQuestion() {
        const p = getPool();
        if (!p.length) return null;
        return p[Math.floor(Math.random() * p.length)];
      }

      function maskSingle(word, firstChar) {
        return firstChar + "_".repeat(word.length - 1);
      }

      function escRe(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      function clozeSentence(sentence, word, noFirst) {
        const re = new RegExp("\\b" + escRe(word) + "\\b", "gi");
        return sentence.replace(re, (m) =>
          noFirst ? maskFull(word) : maskSingle(word, m[0]),
        );
      }

        feedbackEl.className = "feedback";
        feedbackEl.innerHTML = "";
        answerInput.value = "";
        answerInput.disabled = false;
        $("checkBtn").disabled = false;
        $("checkBtn").textContent = "Check";

        const word = current.w;
        const advanced = difficulty === "advanced";
        unitTag.textContent = current.title || "Unit " + current.unit;
        const bank = advanced ? ADVANCED_SENTENCES : SENTENCES;
        current.sentence = mode === "blank" ? bank[current.unit + "." + current.n] : null;
        current.cloze = current.sentence
          ? clozeSentence(current.sentence, word, advanced)
          : null;
        if (mode === "blank") {
          clueLabel.textContent = advanced
            ? "Fill in the blank · no hints"
            : "Fill in the blank";
          clueEl.innerHTML = esc(current.cloze);
          maskEl.textContent = "";
          hintEl.textContent = word.length + " letters";
          answerInput.placeholder = "Type the English word...";
        } else {
          clueLabel.textContent = advanced
            ? "Meaning · no first letter"
            : "Meaning";
          clueEl.textContent = current.m;
          maskEl.textContent = advanced ? maskFull(word) : maskWord(word);
          hintEl.textContent = word.length + " letters";
          answerInput.placeholder = "Type the English word...";
        }
        answerInput.focus();
      }

      function norm(s) {
        return s.toLowerCase().replace(/\s+/g, " ").trim();
      }

      function checkAnswer() {
        if (solved || !current) return;
        const guess = norm(answerInput.value);
        const ok = guess === norm(current.w);

        stats.total++;
        if (ok) {
          stats.correct++;
          stats.streak++;
        } else {
          stats.streak = 0;
        }
        updateScore();

        addHistory({
          word: current.w,
          m: current.m,
          sentence: current.sentence || null,
          guess: answerInput.value.trim() || "(no answer)",
          ok: ok,
          timeLabel: new Date().toLocaleString(),
          mode: mode === "blank" ? "Blank" : "Meaning",
          difficulty: difficulty,
        });

        feedbackEl.className = ok ? "feedback ok" : "feedback bad";
        if (current.sentence) {
          const re = new RegExp("\\b" + escRe(current.w) + "\\b", "gi");
          const full = esc(current.sentence.replace(re, (m) => "<b>" + m + "</b>"));
          feedbackEl.innerHTML =
            (ok ? "<strong>Correct!</strong> " : "<strong>Wrong.</strong> ") +
            full +
            "<br>Meaning: " +
            esc(current.m);
          clueEl.innerHTML = full;
        } else {
          feedbackEl.innerHTML = ok
            ? "<strong>Correct!</strong> " + esc(current.w)
            : '<strong>Wrong.</strong> Correct answer: <span class="answer-line">' +
              esc(current.w) +
              "</span><br>Meaning: " +
              esc(current.m);
          maskEl.textContent = current.w;
        }
        solved = true;
        answerInput.disabled = true;
        $("checkBtn").textContent = "Next";
      }

      function esc(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function updateScore() {
        $("correct").querySelector(".num").textContent = stats.correct;
        $("total").textContent = stats.total;
        $("streak").querySelector(".num").textContent = stats.streak;
      }

      $("checkBtn").addEventListener("click", () => {
        if (solved) render();
        else checkAnswer();
      });
      answerInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          solved ? render() : checkAnswer();
        }
      });
      $("newQuiz").addEventListener("click", () => {
        stats = { correct: 0, total: 0, streak: 0 };
        updateScore();
        render();
      });
      unitSelect.addEventListener("change", render);

      function setMode(m) {
        mode = m;
        $("modeBlank").classList.toggle("active", m === "blank");
        $("modeMeaning").classList.toggle("active", m === "meaning");
        render();
      }
      function setDifficulty(d) {
        difficulty = d;
        $("diffNormal").classList.toggle("active", d === "normal");
        $("diffAdvanced").classList.toggle("active", d === "advanced");
        render();
      }
      $("modeBlank").addEventListener("click", () => setMode("blank"));
      $("modeMeaning").addEventListener("click", () => setMode("meaning"));
      $("diffNormal").addEventListener("click", () => setDifficulty("normal"));
      $("diffAdvanced").addEventListener("click", () => setDifficulty("advanced"));
      $("clearHistory").addEventListener("click", () => {
        history = [];
        saveHistory();
        renderHistory();
      });

      buildSelect();
      render();
      renderHistory();
    </script>
  </body>
</html>
