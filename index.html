      }
      .card {

      }

        padding: 10px;

        font-weight: 600;
        border: 2px solid #bdc3c7;
        border-radius: 8px;
        background: #fff;
        color: #7f8c8d;
        cursor: pointer;
        transition: all 0.15s;
      }
      .mode-btn.active {
        background: #3498db;
        border-color: #3498db;
        color: #fff;
      }
      .clue-label {
        display: block;
        font-size: 11px;
        color: #95a5a6;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
        font-weight: 600;
      }
      .controls label {
        font-size: 14px;
        color: #34495e;
        font-weight: 600;
      }
      select {
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #bdc3c7;
        font-size: 14px;
        background: #fff;
        flex: 1;
        min-width: 160px;
      }
      .score {
        display: flex;
        gap: 18px;
        justify-content: center;
        text-align: center;
      }
      .score .box {
        flex: 1;
      }
      .score .num {
        font-size: 26px;
        font-weight: 700;
        color: #2c3e50;
      }
      .score .lbl {
        font-size: 12px;
        color: #95a5a6;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      #correct .num {
        color: #27ae60;
      }
      #streak .num {
        color: #f39c12;
      }
      .tag {
        display: inline-block;
        background: #eef3fa;
        color: #5b7a9d;
        font-size: 12px;
        border-radius: 20px;
        padding: 3px 12px;
        margin-bottom: 12px;
        font-weight: 600;
      }
      .clue {
        font-size: 20px;
        line-height: 1.5;
        color: #2c3e50;
        background: #f8fafc;
        border-left: 4px solid #3498db;
        padding: 12px 14px;
        border-radius: 6px;
        min-height: 66px;
        word-break: break-word;
      }
      .mask {
        font-size: 30px;
        letter-spacing: 5px;
        text-align: center;
        margin: 18px 0 6px;
        color: #34495e;
        font-weight: 600;
        font-family: "SF Mono", Menlo, Consolas, monospace;
        word-break: break-all;
      }
      .hint {
        text-align: center;
        color: #95a5a6;
        font-size: 12px;
        margin-bottom: 14px;
      }
      .input-row {
        display: flex;
        gap: 8px;
      }
      input[type="text"] {
        flex: 1;
        padding: 12px 14px;
        font-size: 17px;
        border-radius: 8px;
        border: 2px solid #bdc3c7;
        outline: none;
        transition: border-color 0.15s;
      }
      input[type="text"]:focus {
        border-color: #3498db;
      }
      .btn {
        padding: 12px 20px;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #3498db;
        color: #fff;
      }
      .btn:hover {

      }
      .btn.secondary {
        background: #ecf0f1;
        color: #34495e;
      }
      .btn.green {
        background: #27ae60;
      }
      .feedback {
        margin-top: 14px;
        font-size: 15px;
        line-height: 1.5;
        display: none;
      }
      .feedback.ok {
        display: block;
        color: #27ae60;
      }
      .feedback.bad {

        color: #c0392b;
      }
      .answer-line {
        font-weight: 600;
        word-break: break-word;
      }
      .footer {
        text-align: center;
        color: #95a5a6;
        font-size: 12px;
        margin-top: 8px;
      }
    </style>
  </head>

      </div>

        </div>

        </div>
        <div class="box" id="streak">

        </div>
      </div>

      <div class="card" id="quizCard">

        <span class="clue-label" id="clueLabel"></span>
        <div class="clue" id="clue"></div>
        <div class="mask" id="mask"></div>
        <div class="hint" id="hint"></div>
        <div class="input-row">
          <input
            type="text"
            id="answer"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Type the English word..."
          />
          <button class="btn" id="checkBtn">Check</button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>

      <div class="footer">
        Blank · Meaning · Advanced (no letter hints, English → Burmese, full-mask cloze)

0.29":"Reading widely builds a large stock of vocabulary.","10.30":"Critical thinking helps students question ideas and find good answers.","10.42":"Her well-organised notes made revision much easier.","11.15":"Standing up too quickly made him feel light-headed.","11.19":"In winter, the frozen creek was safe enough to walk on.","11.20":"The glassy surface of the lake reflected the mountains perfectly.","11.22":"A convey of quail crossed the path and disappeared into the bushes.","11.26":"He gulped down his drink because he was in a hurry.","12.5":"The apology was a way of saving face for both sides.","12.8":"Refusing to admit the mistake made him lose face in front of his team.","12.15":"She pointed at the map with her index finger.","12.21":"Many ethnic groups live together peacefully in this region.","12.24":"Calling the host by the wrong name was a social faux pas."};

      let pool = [];
      let current = null;
      let solved = false;
      let mode = "blank";
      let advType = "cloze";
      let stats = { correct: 0, total: 0, streak: 0 };

      function buildSelect() {
        const all = document.createElement("option");
        all.value = "all";
        all.textContent = "All Units";
        unitSelect.appendChild(all);
        WORDS.forEach((u) => {
          const o = document.createElement("option");
          o.value = u.unit;
          o.textContent = "Unit " + u.unit + ": " + u.title;
          unitSelect.appendChild(o);
        });
      }

      function getPool() {
        const v = unitSelect.value;
        let items =
          v === "all"
            ? WORDS.flatMap((u) =>
                u.words.map((w) => ({ ...w, unit: u.unit, title: u.title })),
              )
            : WORDS.find((u) => String(u.unit) === v).words.map((w) => ({
                ...w,
                unit: v,
                title: "",
              }));
        if (mode === "blank") {
          items = items.filter((w) => SENTENCES && SENTENCES[w.unit + "." + w.n]);
        }
        return items;
      }

      function maskWord(word) {
        const chars = [...word];
        let out = "";
        chars.forEach((c, i) => {
          if (/[a-zA-Z]/.test(c)) {
            out +=
              i === 0 || (i > 0 && !/[a-zA-Z]/.test(chars[i - 1])) ? c : "_";
          } else {
            out += c;
          }
        });
        return out;
      }

      function maskFull(word) {
        return [...word]
          .map((c) => (/[a-zA-Z]/.test(c) ? "_" : c))
          .join("");
      }

      function pickQuestion() {
        const p = getPool();
        if (!p.length) return null;
        return p[Math.floor(Math.random() * p.length)];
      }

      function maskSingle(word, firstChar) {
        return firstChar + "_".repeat(word.length - 1);
      }

      function escRe(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      function clozeSentence(sentence, word, noFirst) {
        const re = new RegExp("\\b" + escRe(word) + "\\b", "gi");
        return sentence.replace(re, (m) =>
          noFirst ? maskFull(word) : maskSingle(word, m[0]),
        );
      }

      function render() {
        current = pickQuestion();
        solved = false;
        feedbackEl.className = "feedback";
        feedbackEl.innerHTML = "";
        answerInput.value = "";
        answerInput.disabled = false;
        $("checkBtn").disabled = false;
        $("checkBtn").textContent = "Check";

        const word = current.w;
        unitTag.textContent = current.title || "Unit " + current.unit;
        if (mode === "advanced") {
          const hasSentence = !!SENTENCES[current.unit + "." + current.n];
          const types = ["cloze", "recall", "reverse"];
          advType = hasSentence
            ? types[Math.floor(Math.random() * types.length)]
            : types[1 + Math.floor(Math.random() * 2)];
        }
        const isCloze =
          mode === "blank" || (mode === "advanced" && advType === "cloze");
        current.sentence = isCloze
          ? SENTENCES[current.unit + "." + current.n]
          : null;
        current.cloze = current.sentence
          ? clozeSentence(current.sentence, word, mode === "advanced")
          : null;
        if (mode === "advanced" && advType === "cloze") {
          clueLabel.textContent = "Fill in the blank · no hints";
          clueEl.innerHTML = esc(current.cloze);
          maskEl.textContent = "";
          hintEl.textContent = word.length + " letters";
          answerInput.placeholder = "Type the English word...";
        } else if (mode === "advanced" && advType === "recall") {
          clueLabel.textContent = "Meaning · no first letter";
          clueEl.textContent = current.m;
          maskEl.textContent = maskFull(word);
          hintEl.textContent = word.length + " letters";
          answerInput.placeholder = "Type the English word...";
        } else if (mode === "advanced" && advType === "reverse") {
          clueLabel.textContent = "English → Burmese";
          clueEl.textContent = word;
          maskEl.textContent = "";
          hintEl.textContent = "Type the Burmese meaning";
          answerInput.placeholder = "Type the Burmese meaning...";
        } else if (mode === "blank") {
          clueLabel.textContent = "Fill in the blank";
          clueEl.innerHTML = esc(current.cloze);
          maskEl.textContent = "";
          hintEl.textContent = word.length + " letters";
          answerInput.placeholder = "Type the English word...";
        } else {
          clueLabel.textContent = "Meaning";
          clueEl.textContent = current.m;
          maskEl.textContent = maskWord(word);
          hintEl.textContent = word.length + " letters";
          answerInput.placeholder = "Type the English word...";
        }
        answerInput.focus();
      }

      function norm(s) {
        return s.toLowerCase().replace(/\s+/g, " ").trim();
      }

      function normMyn(s) {
        return (s || "")
          .toLowerCase()
          .replace(/\([^)]*\)/g, "")
          .replace(/[၊,။.…\s]+/g, "");
      }

      function mynMatch(guess, target) {
        const g = normMyn(guess);
        const t = normMyn(target);
        if (!g || !t) return false;
        if (g === t) return true;
        const primary = normMyn(String(target).split(/[၊,]/)[0]);
        if (g === primary) return true;
        return (
          t.includes(g) && g.length >= Math.ceil(t.length * 0.6)
        ) || g.split(/[၊,]/).map(normMyn).includes(t);
      }

      function checkAnswer() {
        if (solved || !current) return;
        const guess = norm(answerInput.value);
        const isReverse = mode === "advanced" && advType === "reverse";
        const ok = isReverse
          ? mynMatch(guess, current.m)
          : guess === norm(current.w);

        stats.total++;
        if (ok) {
          stats.correct++;
          stats.streak++;
        } else {
          stats.streak = 0;
        }
        updateScore();

        feedbackEl.className = ok ? "feedback ok" : "feedback bad";
        if (isReverse) {
          feedbackEl.innerHTML =
            (ok ? "<strong>Correct!</strong> " : "<strong>Wrong.</strong> Correct answer: ") +
            (ok ? "" : '<span class="answer-line">') +
            esc(current.m) +
            (ok ? "" : "</span>") +
            "<br>English: " +
            esc(current.w);
          clueEl.textContent = current.m;
        } else if (current.sentence) {
          const re = new RegExp("\\b" + escRe(current.w) + "\\b", "gi");
          const full = esc(current.sentence.replace(re, (m) => "<b>" + m + "</b>"));
          feedbackEl.innerHTML =
            (ok ? "<strong>Correct!</strong> " : "<strong>Wrong.</strong> ") +
            full +
            "<br>Meaning: " +
            esc(current.m);
          clueEl.innerHTML = full;
        } else {
          feedbackEl.innerHTML = ok
            ? "<strong>Correct!</strong> " + esc(current.w)
            : '<strong>Wrong.</strong> Correct answer: <span class="answer-line">' +
              esc(current.w) +
              "</span><br>Meaning: " +
              esc(current.m);
          maskEl.textContent = current.w;
        }
        solved = true;
        answerInput.disabled = true;
        $("checkBtn").textContent = "Next";
      }

      function esc(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function updateScore() {
        $("correct").querySelector(".num").textContent = stats.correct;
        $("total").textContent = stats.total;
        $("streak").querySelector(".num").textContent = stats.streak;
      }

      $("checkBtn").addEventListener("click", () => {
        if (solved) render();
        else checkAnswer();
      });
      answerInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          solved ? render() : checkAnswer();
        }
      });
      $("newQuiz").addEventListener("click", () => {
        stats = { correct: 0, total: 0, streak: 0 };
        updateScore();
        render();
      });
      unitSelect.addEventListener("change", render);

      function setMode(m) {
        mode = m;
        $("modeBlank").classList.toggle("active", m === "blank");
        $("modeMeaning").classList.toggle("active", m === "meaning");
        $("modeAdvanced").classList.toggle("active", m === "advanced");
        render();
      }
      $("modeBlank").addEventListener("click", () => setMode("blank"));
      $("modeMeaning").addEventListener("click", () => setMode("meaning"));
      $("modeAdvanced").addEventListener("click", () => setMode("advanced"));

      buildSelect();
      render();
    </script>
  </body>
